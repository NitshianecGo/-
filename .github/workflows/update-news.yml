name: Refresh WoW news feed
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/fetch_news.py"
      - "scripts/mirror_media.py"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
concurrency:
  group: wow-news-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python and frontend syntax
        run: |
          python -m py_compile scripts/fetch_news.py scripts/mirror_media.py scripts/telegram_bot.py scripts/telegram_digest.py
          node --check app.js
      - name: Fetch news published in the last five days
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ENABLE_AI_SUMMARIES: "true"
          AI_MAX_ITEMS: "18"
        run: python scripts/fetch_news.py
      - name: Install optional image-mirroring dependencies
        if: ${{ vars.ENABLE_MEDIA_MIRROR == 'true' }}
        run: python -m pip install --disable-pip-version-check Pillow boto3
      - name: Mirror licensed thumbnails to Cloudflare R2 (optional)
        if: ${{ vars.ENABLE_MEDIA_MIRROR == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_MAX_IMAGES_PER_RUN: "240"
        run: python scripts/mirror_media.py
      - name: Validate news JSON
        run: python -m json.tool data/news.json > /dev/null
      - name: Commit updated feed, if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "News feed unchanged; no commit needed."
          else
            git commit -m "chore: refresh WoW news feed"
            git push
          fi
